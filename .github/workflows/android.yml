name: Build APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -o HasanMalikTrading_AndroidProject.zip
          mv HasanMalikTrading/* .
          rm -rf HasanMalikTrading

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Code & JVM Settings
        run: |
          echo "kotlin.jvm.target.validation.mode=ignore" >> gradle.properties
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle* || true
          sed -i 's/"1.8"/"17"/g' app/build.gradle* || true
          
          # Fix singleLine issue completely across all kotlin and java files
          grep -rl "singleLine" . | xargs sed -i 's/\.singleLine = true/\.isSingleLine = true/g' || true
          grep -rl "singleLine" . | xargs sed -i 's/\.singleLine = false/\.isSingleLine = false/g' || true
          grep -rl "singleLine" . | xargs sed -i 's/\.singleLine/\.isSingleLine/g' || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: gradle assembleDebug -Pkotlin.jvm.target.validation.mode=ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          
